spring:
  datasource:
    url: jdbc:mysql://localhost:3306/TPGrupalOO2Hito2Grupo07?useSSL=false&allowPublicKeyRetrieval=true&trustServerCertificate=true
    username: root
    password: root
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    # Ejecuta data.sql DESPUÉS de que Hibernate cree/actualice las tablas
    defer-datasource-initialization: true
  sql:
    init:
      # Con MySQL, Spring Boot solo corre data.sql si se le indica explícitamente
      mode: always
  thymeleaf:
    cache: false
