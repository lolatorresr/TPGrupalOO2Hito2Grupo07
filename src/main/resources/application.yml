spring:
  # Conexión a MySQL: host, puerto, base, usuario y contraseña se leen de variables de entorno
  # (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD) para no fijar credenciales en el repo.
  # Si no están definidas se usan los valores por defecto (localhost:3306, root / root).
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:TPGrupalOO2Hito2Grupo07}?useSSL=false&allowPublicKeyRetrieval=true&trustServerCertificate=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    # Ejecuta data.sql DESPUÉS de que Hibernate cree/actualice las tablas
    defer-datasource-initialization: true
  sql:
    init:
      # Con MySQL, Spring Boot solo corre data.sql si se le indica explícitamente
      mode: always
  thymeleaf:
    cache: false
  # Servicio de envío de mail (Gmail por SMTP con STARTTLS en el puerto 587).
  # Usuario y contraseña se leen de las variables de entorno EMAIL_USER y EMAIL_PASSWORD
  # para no subir credenciales al repo; la contraseña es una "contraseña de aplicación" de Google.
  # Si no están definidas quedan vacías: la app arranca igual y solo falla el envío.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USER:}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
