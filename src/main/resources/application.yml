spring:
  datasource:
    url: jdbc:mysql://localhost:3306/TPGrupalOO2Hito2Grupo07?useSSL=false&allowPublicKeyRetrieval=true&trustServerCertificate=true
    username: root
    password: root1234
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    # Ejecuta data.sql DESPUÉS de que Hibernate cree/actualice las tablas
    defer-datasource-initialization: true
  sql:
    init:
      # Con MySQL, Spring Boot solo corre data.sql si se le indica explícitamente
      mode: always
  thymeleaf:
    cache: false
  # Servicio de envío de mail (Gmail por SMTP con STARTTLS en el puerto 587).
  # Usuario y contraseña se leen de las variables de entorno EMAIL_USER y EMAIL_PASSWORD
  # para no subir credenciales al repo; la contraseña es una "contraseña de aplicación" de Google.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USER}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
