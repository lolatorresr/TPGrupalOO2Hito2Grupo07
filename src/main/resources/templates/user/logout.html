<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión finalizada - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/modern-business.css}"/>
</head>
<body class="bg-light">
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-4">
        <div class="login-container">
            <div class="card login-card">
                <div class="card-body">
                    <div class="login-header">
                        <h3>Epicentro Gourmet</h3>
                    </div>

                    <div class="alert alert-success text-center">
                        Sesión finalizada correctamente.
                    </div>

                    <a th:href="@{/login}" class="btn btn-primary w-100">Iniciar sesión</a>
                    <a th:href="@{/index}" class="btn btn-outline-secondary w-100 mt-2">Volver al inicio</a>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
