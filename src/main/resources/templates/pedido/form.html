<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Pedido - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/modern-business.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <link rel="stylesheet" th:href="@{/css/calendario.css}"/>
</head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>
    <main class="container py-4">

    <h2 class="mb-4">Nuevo Pedido</h2>

    <!-- Paso 1: elegir la unidad. Al cambiarla se recarga la página con los platos que ofrece. -->
    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/pedidos/form}" method="get" class="row g-3 align-items-end">
                <div class="col-md-6">
                    <label class="form-label">Unidad de venta:</label>
                    <select name="unidadId" class="form-select" onchange="this.form.submit()">
                        <option value="0" th:if="${#lists.size(unidades) != 1}">-- Seleccionar --</option>
                        <option th:each="u : ${unidades}" th:value="${u.idUnidadDeVenta}"
                                th:selected="${u.idUnidadDeVenta == pedido.unidadId}"
                                th:text="${u.nombreComercial + ' (' + u.codigo + ') - ' + (u.festivalNombre ?: 'sin festival')}"></option>
                    </select>
                    <small class="text-muted" th:unless="${#lists.isEmpty(unidades)}">Al elegir la unidad se cargan los platos que ofrece.</small>
                    <small class="text-danger" th:if="${#lists.isEmpty(unidades) and !#lists.isEmpty(cajaCerrada)}"
                           th:text="'La caja de hoy de ' + ${#strings.listJoin(cajaCerrada, ', ')} + ' ya fue cerrada, por lo que no se pueden cargar más pedidos.'"></small>
                    <small class="text-danger" th:if="${#lists.isEmpty(unidades) and #lists.isEmpty(cajaCerrada)}">No trabaja en ninguna unidad de venta de un festival en curso, por lo que no puede cargar pedidos.</small>
                </div>
            </form>
        </div>
    </div>

    <!-- Paso 2: fecha y cantidades -->
    <div class="card mb-4" th:if="${pedido.unidadId > 0}">
        <div class="card-header fw-bold"
             th:text="'Pedido de ' + ${pedido.unidadNombre} + ' - ' + (${pedido.festivalNombre} ?: 'sin festival')"></div>
        <div class="card-body">
            <form th:action="@{/pedidos/save}" th:object="${pedido}" method="post" class="row g-3">
                <input type="hidden" th:field="*{unidadId}">

                <div th:if="${#fields.hasGlobalErrors()}" class="col-12 alert alert-danger mb-0">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="mb-0"></p>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Fecha del pedido:</label>
                    <input type="text" th:field="*{fechaTransaccion}" class="form-control fecha" required placeholder="dd/mm/aaaa">
                    <small class="text-muted" th:text="'Solo se admite la fecha del día: ' + ${#temporals.format(hoy, 'dd/MM/yyyy')}"></small>
                    <p th:if="${#fields.hasErrors('fechaTransaccion')}" th:errors="*{fechaTransaccion}" class="text-danger"></p>
                </div>

                <div class="col-12">
                    <table class="table table-striped mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Plato</th>
                                <th class="text-end">Precio</th>
                                <th style="width: 160px">Cantidad</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item, it : *{items}">
                                <td>
                                    <input type="hidden" th:field="*{items[__${it.index}__].platoId}">
                                    <span th:text="${item.platoNombre}"></span>
                                </td>
                                <td class="text-end" th:text="'$' + ${#numbers.formatDecimal(item.precio, 1, 'POINT', 2, 'COMMA')}"></td>
                                <td>
                                    <input type="number" min="0" th:field="*{items[__${it.index}__].cantidad}" class="form-control form-control-sm">
                                    <p th:if="${#fields.hasErrors('items[__${it.index}__].cantidad')}"
                                       th:errors="*{items[__${it.index}__].cantidad}" class="text-danger mb-0"></p>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(pedido.items)}">
                                <td colspan="3" class="text-center text-muted py-3">Esta unidad todavía no tiene platos asignados.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="col-12 text-end">
                    <a th:href="@{/pedidos/}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success" th:disabled="${#lists.isEmpty(pedido.items)}">Guardar Pedido</button>
                </div>
            </form>
        </div>
    </div>

    <div class="text-muted" th:if="${pedido.unidadId == 0 and !#lists.isEmpty(unidades)}">Seleccione una unidad de venta para ver sus platos.</div>
    </main>
    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/es.js"></script>
    <script th:src="@{/js/calendario.js}"></script>
</body>
</html>
