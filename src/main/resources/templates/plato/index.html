<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion de Platos - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/modern-business.css}"/>
</head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>
    <main class="container py-4">

    <h2 class="mb-4">Gestión de Platos del Menú</h2>

    <!-- Formulario para Alta de Plato -->
    <div class="card mb-4">
        <div class="card header fw-bold">Agregar Nuevo Plato</div>
        <div class="card-body">
            <form th:action="@{/platos/create}" th:object="${plato}" method="post" class="row g-3">
                <div class="cold-md-4">
                    <label class="form-label">Nombre del Plato:</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Hamburguesa completa">
                    <p th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="text-danger"></p>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Precio de Venta:</label>
                    <input type="number" step="0.01" th:field="*{precio}" class="form-control" required placeholder="0.00">
                    <p th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}" class="text-danger"></p>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Costo de Producción:</label>
                    <input type="number" step="0.01" th:field="*{costo}" class="form-control" required placeholder="0.00">
                    <p th:if="${#fields.hasErrors('costo')}" th:errors="*{costo}" class="text-danger"></p>
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-success">Guardar Plato</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header fw-bold">Menú</div>
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Costo</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${platos}">
                        <td th:text="${p.idPlato}"></td>
                        <td th:text="${p.nombre}"></td>
                        <td th:text="'$' + ${#numbers.formatDecimal(p.precio, 1, 2)}"></td>
                        <td th:text="'$' + ${#numbers.formatDecimal(p.costo, 1, 2)}"></td>
                        <td class="text-center">
                            <form th:action="@{'/platos/delete' + ${p.idPlato}}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Seguro que deseas eliminar este plato?');">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(platos)}">
                        <td colspan="5" class="text-center text-muted py-3">No hay platos registrados todavía.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    </main>
    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
