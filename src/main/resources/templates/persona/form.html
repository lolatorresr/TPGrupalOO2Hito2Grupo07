<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Empleado - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/modern-business.css}"/>
</head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>
    <main class="container py-4">

    <h2 class="mb-4" th:text="${personaDTO.idPersona > 0} ? 'Modificar Empleado' : 'Nuevo Empleado'"></h2>

    <!-- Errores de negocio que lanza el service (edad, DNI o email repetidos) -->
    <div th:if="${errorNegocio}" class="alert alert-danger" th:text="${errorNegocio}"></div>

    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/personas/guardar}" th:object="${personaDTO}" method="post" class="row g-3">
                <input type="hidden" th:field="*{idPersona}">

                <div th:if="${#fields.hasGlobalErrors()}" class="col-12 alert alert-danger">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="mb-0"></p>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Tipo de empleado:</label>
                    <select id="tipo" th:field="*{tipo}" class="form-select" required th:disabled="${personaDTO.idPersona > 0}">
                        <option value="">-- Seleccionar --</option>
                        <option th:each="t : ${tiposPersona}" th:value="${t}" th:text="${t.descripcion}"></option>
                    </select>
                    <!-- al modificar el select está deshabilitado y no se envía: se repite el valor en un hidden -->
                    <input type="hidden" th:if="${personaDTO.idPersona > 0}" th:field="*{tipo}">
                    <p th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}" class="text-danger"></p>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Nombre:</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required maxlength="50">
                    <p th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="text-danger"></p>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Apellido:</label>
                    <input type="text" th:field="*{apellido}" class="form-control" required maxlength="50">
                    <p th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}" class="text-danger"></p>
                </div>

                <div class="col-md-4">
                    <label class="form-label">DNI:</label>
                    <input type="number" min="1" th:field="*{dni}" class="form-control" required>
                    <p th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}" class="text-danger"></p>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Fecha de nacimiento:</label>
                    <input type="date" th:field="*{fechaNacimiento}" class="form-control" required>
                    <p th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}" class="text-danger"></p>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Fecha de ingreso:</label>
                    <input type="date" th:field="*{fechaIngreso}" class="form-control" required>
                    <p th:if="${#fields.hasErrors('fechaIngreso')}" th:errors="*{fechaIngreso}" class="text-danger"></p>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Email:</label>
                    <input type="email" th:field="*{email}" class="form-control" required maxlength="100" placeholder="nombre@epicentro.com">
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></p>
                </div>
                <!-- En el alta la credencial se genera sola (usuario = email, contraseña aleatoria, rol Empleado) -->
                <div class="col-md-6 d-flex align-items-end" th:if="${personaDTO.idPersona == 0}">
                    <small class="text-muted">El usuario será el email y la contraseña se enviará por mail.</small>
                </div>

                <!-- Campos de Cajero -->
                <div id="camposCajero" class="col-12 row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Turno de trabajo:</label>
                        <select th:field="*{turnoTrabajo}" class="form-select">
                            <option value="">-- Seleccionar --</option>
                            <option value="MAÑANA">Mañana</option>
                            <option value="TARDE">Tarde</option>
                            <option value="NOCHE">Noche</option>
                        </select>
                        <p th:if="${#fields.hasErrors('turnoTrabajo')}" th:errors="*{turnoTrabajo}" class="text-danger"></p>
                    </div>
                </div>

                <!-- Campos de Cocinero -->
                <div id="camposCocinero" class="col-12 row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Especialidad:</label>
                        <input type="text" th:field="*{especialidad}" class="form-control" placeholder="Parrilla">
                        <p th:if="${#fields.hasErrors('especialidad')}" th:errors="*{especialidad}" class="text-danger"></p>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Categoría:</label>
                        <select th:field="*{categoria}" class="form-select">
                            <option value="">-- Seleccionar --</option>
                            <option th:each="c : ${categoriasCocina}" th:value="${c}" th:text="${c.descripcion}"></option>
                        </select>
                        <p th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}" class="text-danger"></p>
                    </div>
                </div>

                <div class="col-12 text-end">
                    <a th:href="@{/personas}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar Empleado</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Muestra solo los campos del tipo de empleado elegido
        function actualizarCampos() {
            var tipo = document.getElementById('tipo').value;
            document.getElementById('camposCajero').style.display = (tipo === 'CAJERO') ? '' : 'none';
            document.getElementById('camposCocinero').style.display = (tipo === 'COCINERO') ? '' : 'none';
        }
        document.getElementById('tipo').addEventListener('change', actualizarCampos);
        actualizarCampos();
    </script>
    </main>
    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
