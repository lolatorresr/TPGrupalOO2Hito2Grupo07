<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/modern-business.css}"/>
</head>
<body>

    <!-- Barra de navegación: los accesos se muestran según el rol del usuario (ver SesionAdvice).
         Para agregar una sección nueva alcanza con sumar un <li> con su th:if. -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" th:fragment="navbar">
        <div class="container-fluid px-4">
            <a class="navbar-brand" th:href="@{/index}">Epicentro Gourmet</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link px-3" th:href="@{/index}">Inicio</a>
                    </li>
                    <li class="nav-item" th:if="${roles != null and roles.contains('ROLE_ADMIN')}">
                        <a class="nav-link px-3" th:href="@{/unidades/}">Unidades de Venta</a>
                    </li>
                    <li class="nav-item" th:if="${roles != null and roles.contains('ROLE_ADMIN') or roles.contains('ROLE_RESPONSABLE')}">
                        <a class="nav-link px-3" th:href="@{/platos/}">Platos</a>
                    </li>
                    <li class="nav-item" th:if="${roles != null and roles.contains('ROLE_RESPONSABLE')}">
                        <a class="nav-link px-3" th:href="@{/personas}">Empleados</a>
                    </li>
                    <li class="nav-item" th:if="${logueado == true}">
                        <a class="nav-link px-3" th:href="@{/pedidos/}">Pedidos</a>
                    </li>
                </ul>

                <!-- Sin sesión -->
                <ul class="navbar-nav" th:unless="${logueado == true}">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/registro}">Registrar Unidad de Venta</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-outline-light btn-sm ms-lg-2 mt-1" th:href="@{/login}">Iniciar sesión</a>
                    </li>
                </ul>

                <!-- Con sesión: al apretar el nombre se despliega el menú -->
                <ul class="navbar-nav" th:if="${logueado == true}">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            &#128100; <span th:text="${nombreUsuario}">Usuario</span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-end">
                            <span class="dropdown-item-text small">
                                <span th:text="${username}">usuario</span><br>
                                <span class="text-muted" th:text="${rolNombre}">Rol</span>
                            </span>
                            <div class="dropdown-divider"></div>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item">Cerrar sesión</button>
                            </form>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4" th:fragment="footer">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Epicentro Gourmet - Orientación a Objetos 2 - UNLa - Grupo 07</p>
        </div>
    </footer>

    <!-- Scripts -->
    <div th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </div>

</body>
</html>
