<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reportes - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/modern-business.css}"/>
</head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>
    <main class="container py-4">

    <h2 class="mb-1">Reportes</h2>
    <p class="text-muted mb-4">Consultas del administrador sobre las unidades de venta de un festival.</p>

    <div class="row justify-content-center">
        <div class="col-md-4 mb-3">
            <div class="card access-card h-100">
                <div class="card-body">
                    <div class="icon">&#127942;</div>
                    <h5 class="card-title">Ranking por recaudación</h5>
                    <p class="card-text text-muted">Unidades de un festival ordenadas de mayor a menor recaudación.</p>
                    <a th:href="@{/reportes/ranking}" class="btn btn-primary">Consultar</a>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card access-card h-100">
                <div class="card-body">
                    <div class="icon">&#128176;</div>
                    <h5 class="card-title">Unidades con mayor canon</h5>
                    <p class="card-text text-muted">Las "x" unidades de un festival que más gastaron en canon.</p>
                    <a th:href="@{/reportes/canon}" class="btn btn-primary">Consultar</a>
                </div>
            </div>
        </div>
    </div>
    </main>
    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
