<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Unidades de Venta - Epicentro Gourmet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/modern-business.css}"/>
</head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>
    <main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Unidades de Venta</h2>
        <a th:href="@{/unidades/form}" class="btn btn-success">+ Nueva Unidad</a>
    </div>

    <div class="card">
        <div class="card-header fw-bold">Unidades activas</div>
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Código</th>
                        <th>Nombre Comercial</th>
                        <th>Tipo</th>
                        <th>Festival</th>
                        <th>Responsable</th>
                        <th class="text-end">Superficie (m²)</th>
                        <th class="text-end">Canon</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${unidades}">
                        <td th:text="${u.codigo}"></td>
                        <td th:text="${u.nombreComercial}"></td>
                        <td th:text="${u.tipoDescripcion}"></td>
                        <td th:text="${u.festivalNombre} ?: '-'"></td>
                        <td th:text="${u.responsableNombre} ?: '-'"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(u.superficie, 1, 2)}"></td>
                        <td class="text-end" th:text="'$' + ${#numbers.formatDecimal(u.canon, 1, 2)}"></td>
                        <td class="text-center">
                            <a th:href="@{/unidades/form/{id}(id=${u.idUnidadDeVenta})}" class="btn btn-primary btn-sm">Editar</a>
                            <form th:action="@{/unidades/delete/{id}(id=${u.idUnidadDeVenta})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Seguro que desea dar de baja esta unidad?');">Dar de baja</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(unidades)}">
                        <td colspan="8" class="text-center text-muted py-3">No hay unidades de venta registradas todavía.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    </main>
    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
